name: contract
on:
  push:
    paths: ["contracts/**", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["contracts/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32v1-none }
      - uses: Swatinem/rust-cache@v2
      - name: Contract tests (25 passing incl FIX-1/2/4)
        run: cd contracts && cargo test -p tessera-ledger
      - name: Off-build stubs excluded
        run: test ! -f contracts/Cargo.toml || grep -q "oracle-spike" contracts/Cargo.toml && exit 1 || echo "oracle-spike correctly off-build"
