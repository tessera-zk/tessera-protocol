name: docs
on:
  push:
    paths: ["docs/**", "*.md", "frontend/README.md", "circuits/README.md"]
  pull_request:
    paths: ["docs/**", "*.md"]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs cross-links resolve
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          const files=[...fs.readdirSync('docs').map(f=>'docs/'+f),'README.md','PRD.md','ARCHITECTURE.md','ADVANCED-STATUS.md','BENCHMARKS.md'];
          let bad=0;
          for(const f of files){const s=fs.readFileSync(f,'utf8');for(const m of s.matchAll(/\]\( *([^ )]+) *\)/g)){const t=m[1];if(/^https?:|#|mailto:/.test(t))continue;const p=path.normalize(path.join(path.dirname(f),t.split('#')[0]));if(!fs.existsSync(p)){console.error('BROKEN',f,'->',t);bad++;}}}
          if(bad){process.exit(1)}else{console.log('docs links OK ('+files.length+' files)')}
          "
      - name: Forbid NEXT_PUBLIC secrets in docs
        # SECRET suffix only: public client config (CONTRACT_ID, RPC_URL, ...) is fine.
        run: "! grep -rn 'NEXT_PUBLIC_[A-Z0-9_]*SECRET' docs/ README.md frontend/README.md 2>/dev/null || (echo 'secret hygiene violation' && exit 1)"
  sep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: SEP examples validate (schema, all blocks)
        run: node scripts/validate_sep.js --doc docs/SEP-ATTESTATION-EXAMPLES.md
      - name: SEP examples validate (strict, zero warnings)
        run: node scripts/validate_sep.js --strict --doc docs/SEP-ATTESTATION-EXAMPLES.md
      - name: SEP adversarial corpus
        run: node --test scripts/validate_sep.test.js
      - name: Badge freshness checker (offline fixtures + unit tests)
        run: |
          node --test scripts/check_badge_freshness.test.js
          printf '{"status":"healthy","timestamp":1788510000,"boundLedger":4490585}' > /tmp/stale.json
          node scripts/check_badge_freshness.js --status /tmp/stale.json --now 2026-09-10T12:00:00Z --current-ledger 4604000 && exit 1 || echo "stale fixture correctly non-fresh"
